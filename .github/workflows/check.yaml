on: # yamllint disable-line rule:truthy
  push:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version-file: package.json }
      - run: |
          node -p "require('./package.json').engines.npm" \
          | xargs -I{} npm --global install "npm@{}"
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npm version && npm ci && npm test
      - run: chmod -R +rX output/
      - run: >
          tar --dereference --hard-dereference --directory output/
          -cvf "$RUNNER_TEMP/artifact.tar" .
      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/artifact.tar
          name: github-pages
          if-no-files-found: error
  zizmor:
    runs-on: ubuntu-26.04
    # https://github.com/zizmorcore/zizmor-action#permissions
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
