on: # yamllint disable-line rule:truthy
  push:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version-file: package.json }
      - run: |
          node -p "require('./package.json').engines.npm" \
          | xargs -I{} npm --global install "npm@{}"
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # yamllint disable-line rule:line-length
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: extract_metadata
      - run: npm version && npm ci && npm test
        env: { SITEURL: "${{ steps.extract_metadata.outputs.base_url }}" }
      - run: chmod -R +rX output/
      - run: >
          tar --sort=name --dereference --hard-dereference --directory output/
          --mtime='1980-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner
          -cvf "$RUNNER_TEMP/artifact.tar" .
      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/artifact.tar
          name: github-pages
          if-no-files-found: error
      - run: echo "ARTIFACT_NAME=${BRANCH//[^A-Za-z0-9-]/-}" >> "$GITHUB_ENV"
        env: { BRANCH: "${{ github.head_ref || github.ref_name }}" }
      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/artifact.tar
          name: ${{ env.ARTIFACT_NAME }}
      # the uv command below should match the shebang in pelicanconf.py
      - run: uv tool run --with-requirements=requirements.txt python --version
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    concurrency: { group: pages, cancel-in-progress: false }
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - id: one
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
    environment:
      name: github-pages
      url: ${{ steps.one.outputs.page_url }}
  zizmor:
    runs-on: ubuntu-26.04
    # https://github.com/zizmorcore/zizmor-action#permissions
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
